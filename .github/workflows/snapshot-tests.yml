name: Snapshot Tests

on:
  push:
    branches: ["main"]
  pull_request:
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app

jobs:
  snapshot-tests:
    name: ${{ matrix.check_name }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: iOS
            check_name: snapshot-ios-tests
            scheme: Example
            test_plan: ExampleTests
            destination: platform=iOS Simulator,name=iPhone Air,OS=27.0
          - platform_name: iPadOS
            check_name: snapshot-ipados-tests
            scheme: Example
            test_plan: ExampleTests
            destination: platform=iOS Simulator,name=iPad Pro 11-inch (M5),OS=27.0
          - platform_name: tvOS
            check_name: snapshot-tvos-tests
            scheme: Example
            test_plan: ExampleTests
            destination: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
          - platform_name: macOS
            check_name: snapshot-macos-tests
            scheme: Example
            test_plan: ExampleTests
            destination: platform=macOS,arch=arm64
          - platform_name: visionOS
            check_name: snapshot-visionos-tests
            scheme: Example
            test_plan: ExampleTests
            destination: platform=visionOS Simulator,name=Apple Vision Pro,OS=27.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run tests
        run: |
          set -euo pipefail
          echo "Running ${{ matrix.platform_name }} snapshot tests"
          xcodebuild clean test \
            -skipMacroValidation \
            -project "Example/Example.xcodeproj" \
            -scheme "${{ matrix.scheme }}" \
            -testPlan "${{ matrix.test_plan }}" \
            -destination "${{ matrix.destination }}"
  snapshot-watchos-tests:
    name: snapshot-watchos-tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The runner image pairs every preinstalled watch simulator with an iPhone simulator.
      # Testing on a paired watch makes xcodebuild boot that iPhone and connect through it,
      # which intermittently hangs, so the tests run on a fresh, unpaired watch instead.
      - name: Create watch simulator
        id: watch-simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl create "Snapshot Watch" "Apple Watch Series 12 (46mm)" "watchOS 27.0")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: |
          set -euo pipefail
          echo "Running watchOS snapshot tests"
          xcodebuild clean test \
            -skipMacroValidation \
            -project "Example/Example.xcodeproj" \
            -scheme "ExampleWatch Watch App" \
            -testPlan "ExampleWatchTests" \
            -destination "id=${{ steps.watch-simulator.outputs.udid }}"
